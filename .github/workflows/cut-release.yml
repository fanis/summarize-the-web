name: Cut Release

# Manually-triggered release: bumps the version everywhere, moves the
# [Unreleased] changelog section under the new version, runs the full test
# suite, builds, commits, tags, and publishes the GitHub release with the
# built userscript attached.
#
# Trigger it from the Actions tab, the gh CLI
# (gh workflow run cut-release.yml -f bump=minor), or any GitHub API client.
#
# Note: the release is created directly by this workflow rather than by
# release.yml, because tags pushed with the default GITHUB_TOKEN do not
# trigger other workflows. release.yml still covers manually-pushed tags.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (ignored if an explicit version is given)'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version:
        description: 'Explicit version (e.g. 2.7.0) — overrides the bump type'
        type: string
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No npm cache / npm ci: this repo intentionally does not commit
      # package-lock.json (see .gitignore), which both of those require.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Require an Unreleased changelog section
        run: |
          if ! grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            echo '::error::CHANGELOG.md has no "## [Unreleased]" section — add release notes before cutting a release.'
            exit 1
          fi

      - name: Compute new version
        id: version
        run: |
          set -e
          if [ -n "${{ inputs.version }}" ]; then
            npm version "${{ inputs.version }}" --no-git-tag-version
          else
            npm version "${{ inputs.bump }}" --no-git-tag-version
          fi
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION"

      - name: Fail if tag already exists
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists."
            exit 1
          fi

      - name: Update version in banner, README and CHANGELOG
        run: |
          set -e
          VERSION="${{ steps.version.outputs.VERSION }}"
          TODAY=$(date -u +%Y-%m-%d)
          sed -E -i "s|(@version[[:space:]]+)[0-9]+\.[0-9]+\.[0-9]+|\1$VERSION|" src/banner.txt
          sed -E -i "s|(\*\*Latest Version\*\*: )[0-9]+\.[0-9]+\.[0-9]+|\1$VERSION|" README.md
          sed -i "s|^## \[Unreleased\]|## [$VERSION] - $TODAY|" CHANGELOG.md
          grep -q "@version      $VERSION" src/banner.txt
          grep -q "$VERSION" README.md
          grep -q "^## \[$VERSION\]" CHANGELOG.md

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run all tests
        run: npm run test:all

      - name: Build
        run: npm run build

      - name: Commit and tag
        run: |
          set -e
          VERSION="${{ steps.version.outputs.VERSION }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/banner.txt README.md CHANGELOG.md dist/summarize-the-web.js
          git commit -m "Release $VERSION"
          git tag "$VERSION"
          git push origin HEAD
          git push origin "$VERSION"

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          CHANGELOG=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") found=1
              next
            }
            found { print }
          ' CHANGELOG.md)

          echo "CHANGELOG<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          files: dist/summarize-the-web.js
          draft: false
          prerelease: false
